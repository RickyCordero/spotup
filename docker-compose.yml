version: "3"
services:
  navidrome:
    image: deluan/navidrome:latest
    user: 1000:1000 # should be owner of volumes
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      # Optional: put your config options customization here. Examples:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info  
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
      ND_UIWELCOMEMESSAGE: "Your music awaits you 🐱‍🚀"
      ND_ENABLESHARING: 1
    volumes:
      - "/mnt/c/Users/ricky:/data"
      - "/mnt/c/Users/ricky/Music/Songs/FL\ Studio\ Rendered:/music:ro"